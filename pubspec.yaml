name: weather_rpg
description: A retro pixel-art RPG themed live weather app.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.4.0
  flame: ^1.32.0
  shared_preferences: ^2.5.6
  geolocator: ^14.1.1
  vector_math: ^2.1.4
  flutter_riverpod: ^2.5.1
  audioplayers: ^6.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  test: ^1.25.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/goblin_frames/
    - assets/audio/